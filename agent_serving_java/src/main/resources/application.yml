server:
  port: 8000

logging:
  level:
    com.coremasterkb.serving: DEBUG

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:test_db}
    username: ${DB_USER:zdy}
    password: ${DB_PASSWORD:zdy1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.coremasterkb.serving.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

serving:
  llm-service:
    base-url: ${LLM_SERVICE_BASE_URL:http://localhost:8900}
    enabled: ${LLM_SERVICE_ENABLED:true}
    connect-timeout: ${LLM_SERVICE_CONNECT_TIMEOUT:3000ms}
    read-timeout: ${LLM_SERVICE_READ_TIMEOUT:120s}
  fts:
    strategy: ${SERVING_FTS_STRATEGY:postgresql}
  zhipu:
    api-key: ${ZHIPU_API_KEY:bec7cc02fc88529bee532a07070f4e80.PbObZYZROyxvmtfq}
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    embedding-model: ${ZHIPU_EMBEDDING_MODEL:embedding-3}
    embedding-dimensions: ${ZHIPU_EMBEDDING_DIMENSIONS:2048}
    rerank-model: ${ZHIPU_RERANK_MODEL:rerank}
  assembler:
    low-confidence-threshold: 0.1
  retrieval:
    rrf-k: 60
    retriever-weights:
      fts_bm25: 1.0
      entity_exact: 1.0
      dense_vector: 0.8
  dense-vector:
    top-k: 50
    max-load: 5000
  reranker:
    low-value-block-penalty: 0.3
    boost-semantic-role: 0.30
    boost-block-type: 0.15
    boost-scope-match: 0.20
    boost-entity-match: 0.25
  domain:
    products:
      - UDG
      - UNC
      - CloudCore
    network-elements:
      - AMF
      - SMF
      - UPF
      - UDM
      - PCF
      - NRF
      - AUSF
      - BSF
      - NSSF
      - SCP
      - UDSF
      - UDR
