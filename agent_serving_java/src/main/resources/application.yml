server:
  port: 8081

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:15432}/${PG_DBNAME:test_db}
    username: ${PG_USER:zdy}
    password: ${PG_PASSWORD:zdy1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${PG_POOL_MIN:2}
      maximum-pool-size: ${PG_POOL_MAX:10}
      connection-timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.coremasterkb.serving.entity

serving:
  scenario-packs-dir: ${SCENARIO_PACKS_DIR:../scenario_packs}
  domain-registry-path: ${DOMAIN_REGISTRY_PATH:../domain_registry.yaml}
  default-domain: ${COREMASTERKB_DOMAIN:${DEFAULT_DOMAIN:cloud_core_network}}
  llm:
    base-url: ${LLM_SERVICE_URL:http://localhost:8900}
