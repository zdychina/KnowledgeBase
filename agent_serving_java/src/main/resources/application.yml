server:
  port: 8081

spring:
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/coremasterkb}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.coremasterkb.serving.entity

serving:
  scenario-packs-dir: ${SCENARIO_PACKS_DIR:../scenario_packs}
  default-domain: ${DEFAULT_DOMAIN:cloud_core_network}
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    rerank-model: ${RERANK_MODEL:bge-reranker-v2-m3}
  embedding:
    model: ${EMBEDDING_MODEL:}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
