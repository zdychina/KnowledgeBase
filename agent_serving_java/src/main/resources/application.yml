server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DBNAME:coremasterkb}
    username: ${PG_USER:kb_user}
    password: ${PG_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${PG_POOL_MIN:2}
      maximum-pool-size: ${PG_POOL_MAX:10}
      connection-timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.coremasterkb.serving.entity

serving:
  scenario-packs-dir: ${SCENARIO_PACKS_DIR:../scenario_packs}
  default-domain: ${COREMASTERKB_DOMAIN:${DEFAULT_DOMAIN:cloud_core_network}}
  llm:
    base-url: ${LLM_SERVICE_URL:}
    api-key: ${LLM_SERVICE_PROVIDER_API_KEY:}
  zhipu:
    api-key: ${RERANK_API_KEY:}
    base-url: ${RERANK_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    rerank-model: ${RERANK_MODEL:rerank-pro}
  embedding:
    model: ${EMBEDDING_MODEL:embedding-3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
  rerank:
    model: ${RERANK_MODEL:rerank-pro}
