# CoreMasterKB All-in-One
#
# Usage:
#   docker compose up -d            # 启动
#   docker compose logs -f          # 看日志
#   docker compose exec app bash    # 进入容器手动操作
#   docker compose down             # 停止

services:
  app:
    # ── 镜像来源（二选一）──────────────────────────────────
    # 本地开发：用 build 从源码构建
    build:
      context: .
      dockerfile: docker/Dockerfile
    # 服务器部署：用 image 直接加载（注释掉上面的 build，取消注释下面这行）
    # image: coremasterkb-app:latest

    container_name: cmkb
    ports:
      - "80:80"       # nginx (kb-ui)
      - "8900:8900"   # llm_service
      - "8901:8901"   # knowledge_mining
      - "8910:8910"   # main_control_service
      - "8081:8081"   # agent_serving_java
      - "9000:9000"   # mcp_server
    volumes:
      - uploads:/app/uploads
      - control_data:/app/data
      # ── 挂载代码和配置（服务器部署用）──────────────────────
      # 本地开发可以注释掉下面这些，直接用镜像内置代码
      # 服务器上取消注释，修改宿主机文件后 supervisorctl restart 即可生效
      - ./.env:/app/.env
      - ./domain_registry.yaml:/app/domain_registry.yaml
      - ./scenario_packs:/app/scenario_packs
      - ./knowledge_mining:/app/knowledge_mining
      - ./llm_service:/app/llm_service
      - ./main_control_service:/app/main_control_service
      - ./mcp_server:/app/mcp_server
      - ./databases:/app/databases
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  uploads:
  control_data:
