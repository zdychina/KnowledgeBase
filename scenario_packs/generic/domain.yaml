# Scenario pack for the generic domain.
# General-purpose knowledge base with no domain-specific command vocabulary.
# Used as a fallback or for non-5G content.

entity_types:
  - concept
  - term
  - parameter

strong_entity_types: []

extractor_rules: []

serving:
  # No command_regex / op_map / network_elements / products overrides —
  # the engine's built-in defaults are appropriate for generic content.
  query_understanding: {}

  # Balanced route policy: no strong prior on retrieval strategy.
  # Dense vector slightly preferred for concept and comparison queries
  # where semantic similarity matters more than keyword overlap.
  route_policy:
    default:
      lexical_bm25:
        weight: 1.0
        top_k: 50
      dense_vector:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.6
        top_k: 15

    command_usage:
      lexical_bm25:
        weight: 1.2
        top_k: 50
      entity_exact:
        weight: 1.0
        top_k: 20
      dense_vector:
        weight: 0.6
        top_k: 30

    concept_lookup:
      dense_vector:
        weight: 1.2
        top_k: 60
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.4
        top_k: 10

    troubleshooting:
      lexical_bm25:
        weight: 1.1
        top_k: 50
      dense_vector:
        weight: 0.9
        top_k: 40
      entity_exact:
        weight: 0.6
        top_k: 15

    procedure:
      lexical_bm25:
        weight: 1.1
        top_k: 50
      dense_vector:
        weight: 0.9
        top_k: 40
      entity_exact:
        weight: 0.5
        top_k: 10

    comparison:
      dense_vector:
        weight: 1.2
        top_k: 60
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.5
        top_k: 10

    navigational:
      lexical_bm25:
        weight: 1.2
        top_k: 30
      entity_exact:
        weight: 1.0
        top_k: 10
      dense_vector:
        weight: 0.4
        top_k: 10

    general:
      lexical_bm25:
        weight: 1.0
        top_k: 50
      dense_vector:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.6
        top_k: 15

eval_questions:
  - question: "什么是 PDU 会话？"
    intent: concept_lookup
  - question: "如何查询系统当前配置？"
    intent: command_usage
  - question: "系统连接失败怎么处理？"
    intent: troubleshooting
