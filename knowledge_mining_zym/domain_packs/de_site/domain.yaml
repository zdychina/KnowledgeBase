# ---------------------------------------------------------------------------
# LLM templates (站点基础设施领域)
# ---------------------------------------------------------------------------

llm_templates:
  - template_key: mining-question-gen
    template_version: "3"
    purpose: "从段落内容生成假设性检索问题"
    system_prompt: "你是德国移动通信站点基础设施规范知识库的检索优化助手。你判断段落是否值得生成问题，如果是则生成高质量检索问题。"
    user_prompt_template: >
      分析以下技术文档段落：

      段落标题：$title
      段落内容：$content

      首先评估该段落是否包含值得生成问题的实质性知识：
      - 如果是目录、导航列表、纯链接/锚点列表：输出空数组 []
      - 如果是大量空值或占位符的稀疏表格：输出空数组 []
      - 如果内容过于简短或模糊，无法生成有意义的问题：输出空数组 []

      如果段落确实包含实质性知识（规范条款、规划要求、施工步骤、电气/防雷要求、设备规格、验收准则等），生成 1-2 个问题：
      - 问题必须能从该段落中找到明确答案
      - 问题应测试规范理解或工程要求，而非导航（避免"在哪里找到X"、"文档有哪些章节"）
      - 避免生成高度相似或近义的问题

      输出 JSON 数组，每个元素包含 question 字段。无合适问题时输出空数组 []。

      输出示例（仅供参考格式，请根据实际内容生成）：
      [{"question": "Dachstandort 的天线接地需要满足哪些防雷规范？"}]
    expected_output_type: json_array
    output_schema_json: '{"type":"array","items":{"type":"object","properties":{"question":{"type":"string"}},"required":["question"],"additionalProperties":false}}'

  - template_key: mining-segment-understanding
    template_version: "3"
    purpose: "从段落提取实体、分类语义角色、评估内容质量"
    system_prompt: "你是德国移动通信站点基础设施规范知识库的内容理解助手。分析技术文档段落，提取关键实体（站点载体、设备、标准、材料、电气/防雷对象等）、分类语义角色，并评估内容质量。"
    user_prompt_template: >
      分析以下技术文档段落：

      段落标题：$section_title
      内容类型：$block_type
      段落内容：$text

      输出 JSON 对象，包含：
      - entities: 实体列表，每个元素包含 type 和 name
        type 可选值（按业务大类示例）：
          站点：site / site_type / site_carrier_type / location / lifecycle_phase
          标准/审批：standard / regulation / authority / certificate / approval / permit
          规划/静力：planning_requirement / static_calculation / load_case / load_assumption / proof_type / structural_system / foundation
          土建/钢构：material / material_grade / construction_component / steel_component / fastening_component / tower / mast / platform / ladder / cable_route
          天线/无线：antenna / sector_antenna / microwave_antenna / beamforming_antenna / RET_system / AISG_interface / filter_combiner / radio_unit / downtilt
          系统设备：vendor / equipment / equipment_model / equipment_module / BTS / BBU / RRU / RRH / AAU / SSC / cabinet / port / interface / slot
          电气：electrical_system / grid_connection / meter_system / electrical_sub_distribution / AC_distribution / DC_power_system / battery_system / cable / cable_type / fuse_protection / power_calculation / grounding
          防雷接地：lightning_protection_system / antenna_grounding / equipotential_bonding / surge_protection / SPD / OVP_Box / separation_distance
          机房/环境/安全：indoor_room / container / climate_system / ventilation_system / noise_protection / access_route / working_area / safety_equipment / signage
          流程/参数：acceptance / checklist / defect / procedure / procedure_step / requirement / parameter / numeric_constraint / concept

      质量指引：
      - 只提取文档中明确出现、有专有名称的技术实体
      - 标准/规范代号（如 EN1090、DIN EN 62305、VDE 0185-305、TA Lärm）归为 standard 或 regulation 类型
      - 主管机关与审批方（如 BNetzA、DFS、Deutsche Bahn、Telefónica Germany）归为 authority 类型
      - 站点载体类型（Dachstandort、Hochspannungsmast、Windenergieanlage、Kirche、Indoorstandort、Containerstandort 等）归为 site_carrier_type
      - 厂家（NOKIA、Huawei、Kathrein、Dehn 等）归为 vendor；具体设备型号（如 BBU5900、Flexi MR10）归为 equipment_model
      - 数值约束（如螺栓数量、开口尺寸、分离距离、噪声限值）归为 numeric_constraint
      - 如果无法确定实体类型，不要强行分类

      - semantic_role: 语义角色（concept/parameter/example/note/procedure_step/troubleshooting_step/constraint/requirement/acceptance_criteria/checklist/unknown）
      - document_type: 文档类型提示（planning/requirement/procedure/installation/electrical/lightning/equipment/acceptance/reference/other）
      - content_assessment: 内容质量评估
        - is_substantive: 是否包含实质性知识内容（非纯导航、目录、链接列表）
        - is_navigation: 是否是导航/目录内容
        - assessment_reason: 一句话说明判断依据

      内容质量评估指引：
      - 如果段落只是锚点列表、目录索引、纯链接，is_substantive=false, is_navigation=true
      - 如果段落包含具体的规范条款、参数说明、操作步骤、设备规格，is_substantive=true
      - 稀疏表格（大量空值或占位符"-"）视为非实质性内容
      - 纯标题无内容视为非实质性内容

      输出示例（仅供参考格式，请根据实际内容生成）：
      {"entities": [{"type": "site_carrier_type", "name": "Dachstandort"}, {"type": "standard", "name": "DIN EN 62305"}, {"type": "lightning_protection_system", "name": "Blitzschutzsystem"}], "semantic_role": "requirement", "document_type": "lightning", "content_assessment": {"is_substantive": true, "is_navigation": false, "assessment_reason": "包含具体的防雷规范条款"}}
    expected_output_type: json_object
    output_schema_json: '{"type":"object","properties":{"entities":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"name":{"type":"string"}},"required":["type","name"],"additionalProperties":false}},"semantic_role":{"type":"string"},"document_type":{"type":"string"},"content_assessment":{"type":"object","properties":{"is_substantive":{"type":"boolean"},"is_navigation":{"type":"boolean"},"assessment_reason":{"type":"string"}},"required":["is_substantive","is_navigation"],"additionalProperties":false}},"required":["entities","semantic_role","document_type","content_assessment"],"additionalProperties":false}'

  - template_key: mining-discourse-relation
    template_version: "2"
    purpose: "分析段落间的语篇关系（RST修辞结构理论）"
    system_prompt: "你是德国移动通信站点基础设施规范文档的语篇关系分析专家。分析给定段落列表中相邻段落之间的修辞关系。"
    user_prompt_template: >
      分析以下编号段落之间的语篇关系：

      $segments

      对每对相邻或同节段落，判断其修辞关系。从以下关系类型中选择最合适的一种：
      - ELABORATION: 后段对前段进行详述/展开（典型标志词：具体来说、其中、包括）
      - SEQUENCE: 两段按时间/步骤顺序排列（典型标志词：然后、接下来、步骤N）
      - CAUSATION: 前段是后段的原因或结果（典型标志词：因此、导致、由于）
      - EVIDENCE: 后段为前段提供证据/依据（典型标志词：例如、数据显示、根据）
      - BACKGROUND: 前段为后段提供背景知识（典型标志词：背景是、目前、现状）
      - EXEMPLIFICATION: 后段是前段的具体例子（典型标志词：比如、以X为例）
      - CONTRAST: 两段形成对比或转折（典型标志词：但是、相比之下、而）
      - CONCESSION: 承认一方观点但强调另一方（典型标志词：虽然、尽管、即使）
      - CONDITION: 前段是后段的触发条件（典型标志词：如果、当...时、前提是）
      - PURPOSE: 后段说明前段操作的目的/意图（典型标志词：为了、目的是、以便）

      输出 JSON 数组，每个元素包含：
      - source: 源段落编号（整数）
      - target: 目标段落编号（整数）
      - relation: 关系类型（大写，从上述10种中选择）
      - confidence: 置信度（0.0-1.0）

      只输出有明确关系的段落对，无明显关系的跳过。

      输出示例（仅供参考格式，请根据实际内容生成）：
      [{"source": 1, "target": 2, "relation": "ELABORATION", "confidence": 0.9}]
    expected_output_type: json_array
    output_schema_json: '{"type":"array","items":{"type":"object","properties":{"source":{"type":"integer"},"target":{"type":"integer"},"relation":{"type":"string"},"confidence":{"type":"number","minimum":0.0,"maximum":1.0}},"required":["source","target","relation","confidence"],"additionalProperties":false}}'

  - template_key: mining-contextual-retrieval
    template_version: "2"
    purpose: "为每个段落生成上下文描述，增强检索效果"
    system_prompt: "你是德国移动通信站点基础设施规范文档的检索上下文定位助手。"
    user_prompt_template: >
      文档全文：
      $document

      段落内容：
      $segment

      请生成一句 20-40 字的中文上下文标签，说明该段落在文档中的位置和主题。
      不要复述段落内容，只补充从段落文本中无法直接看出的上下文信息（如所属章节、讨论主题、适用站点载体等）。
      输出 JSON 对象，包含 context 字段。

      输出示例（仅供参考格式，请根据实际内容生成）：
      {"context": "该段落位于天线系统接地章节，讨论 Dachstandort 防雷规范"}
    expected_output_type: json_object
    output_schema_json: '{"type":"object","properties":{"context":{"type":"string"}},"required":["context"],"additionalProperties":false}'

# ---------------------------------------------------------------------------
# Eval questions (12 initial golden queries; expand to 30 later)
# ---------------------------------------------------------------------------

eval_questions:
  - id: q001
    question: "德国移动站点规划文档中，站点编号和网元编号属于哪类规划内容？"
    expected_entities: ["site_number", "network_element_number"]
    expected_evidence_contains: ["站点编号", "网元编号", "规划"]
    expected_semantic_role: requirement
    notes: "测试规划文档中的编号体系"

  - id: q002
    question: "什么情况下需要 EMVU-Antrag 或 BNetzA Standortbescheinigung？"
    expected_entities: ["EMVU-Antrag", "BNetzA", "Standortbescheinigung"]
    expected_evidence_contains: ["EMVU", "BNetzA"]
    expected_semantic_role: requirement
    notes: "测试审批/许可触发条件"

  - id: q003
    question: "Dachstandort 和 Neubauturm 在静力计算或荷载假定上有哪些差异？"
    expected_entities: ["Dachstandort", "Neubauturm"]
    expected_evidence_contains: ["Dachstandort", "Neubauturm", "静力"]
    notes: "测试站点载体对比与静力计算"

  - id: q004
    question: "高压电塔作为移动通信站点时，需要关注哪些规划、静力和电气要求？"
    expected_entities: ["Hochspannungsmast"]
    expected_evidence_contains: ["Hochspannungsmast", "静力", "电气"]
    expected_semantic_role: requirement
    notes: "测试特殊载体多维度要求"

  - id: q005
    question: "Telefónica Germany 自有构件在站点现场什么时候需要永久标识？"
    expected_entities: ["Telefónica Germany", "signage"]
    expected_evidence_contains: ["Telefónica", "标识"]
    expected_semantic_role: requirement
    notes: "测试现场标识规则"

  - id: q006
    question: "建设工程 Abnahme 需要什么文件才算正式完成？"
