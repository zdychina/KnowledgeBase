# Business scope:
#   德国移动通信站点基础设施知识库，覆盖站点规划、站点条件、特殊载体、静力计算、
#   天线系统、系统设备安装、土建施工、电气安装、防雷接地、安全设施、现场标识、
#   访问路径、空调通风、噪声防护、验收交付、扩容改造和拆除等全生命周期工程规范。
#
# 该领域不包含命令操作（无 ADD/MOD/DEL 类网元命令）。核心知识形态为：
# 规范条款、工程对象、厂家设备、标准法规、数值约束、验收流程。
# ---------------------------------------------------------------------------

