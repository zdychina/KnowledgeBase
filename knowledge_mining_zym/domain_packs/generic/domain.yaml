# Generic Domain Pack
# Zero-configuration defaults for any technical documentation domain.
# No industry-specific entities, regex, or prompts.

domain_id: generic
display_name: "Generic Technical Documentation"

entity_types:
  - concept

strong_entity_types: []

role_keyword_rules:
  - keywords: ["parameter", "parameters", "参数"]
    role: parameter
  - keywords: ["example", "examples", "示例"]
    role: example
  - keywords: ["step", "steps", "procedure", "流程"]
    role: procedure_step
  - keywords: ["troubleshoot", "troubleshooting", "故障"]
    role: troubleshooting_step
  - keywords: ["constraint", "limitation", "限制"]
    role: constraint
  - keywords: ["overview", "introduction", "概述"]
    role: concept

heading_role_keywords:
  - keywords: ["parameter", "parameters"]
    role: parameter_definition
  - keywords: ["example", "examples"]
    role: example_section
  - keywords: ["step", "steps", "procedure"]
    role: procedure_section
  - keywords: ["troubleshoot", "troubleshooting"]
    role: troubleshooting_section
  - keywords: ["constraint", "limitation"]
    role: constraint_section
  - keywords: ["overview", "introduction"]
    role: overview_section

extractor_rules: []

parameter_column_names:
  - "parameter"
  - "Parameter"
  - "参数标识"
  - "参数名称"

section_title_command_pattern: ""

retrieval_policy:
  raw_text: primary
  generated_question: auxiliary
  entity_card: strong_entities_only
  table_row: structured_tables
  max_questions_per_segment: 2
  max_entity_cards_per_segment: 3

llm_templates:
  - template_key: mining-question-gen
    template_version: "3"
    purpose: "Generate hypothetical retrieval questions from segment content"
    system_prompt: "You are a retrieval optimization assistant. You decide whether a segment is worth generating questions for, and if so, generate high-quality retrieval questions."
    user_prompt_template: >
      Analyze the following technical documentation segment:

      Segment title: $title
      Segment content: $content

      First, assess whether this segment contains substantive knowledge that a user would ask questions about.
      - If this is a table of contents, navigation list, or contains only structural links/headings: output an empty array []
      - If this is a sparse table with mostly empty or placeholder values: output an empty array []
      - If the content is too brief or vague to generate meaningful questions: output an empty array []

      If the segment IS substantive, generate 1-2 questions:
      - Questions must be directly answerable from this segment's content
      - Questions should test knowledge, not navigation (avoid "where to find X", "what sections are in this document")
      - Avoid generating similar or synonymous questions

      Output a JSON array. Each element contains a "question" field.
      Output empty array [] if no good questions can be generated.

      Output example (format reference only, generate based on actual content):
      [{"question": "How does the caching mechanism work?"}]
    expected_output_type: json_array
    output_schema_json: '{"type":"array","items":{"type":"object","properties":{"question":{"type":"string"}},"required":["question"],"additionalProperties":false}}'

  - template_key: mining-segment-understanding
    template_version: "3"
    purpose: "Extract entities, classify semantic role, and assess content quality"
    system_prompt: "You are a content understanding assistant for technical documentation. Analyze segments and extract key entities with semantic role classification and content quality assessment."
    user_prompt_template: >
      Analyze the following technical documentation segment:

      Section title: $section_title
      Block type: $block_type
      Content: $text

      Output a JSON object with:
      - entities: list of entities, each with "type" and "name"
        type values: concept
      - semantic_role: one of concept/parameter/example/note/procedure_step/troubleshooting_step/constraint/alarm/checklist/unknown
      - document_type: one of command/feature/procedure/troubleshooting/alarm/constraint/checklist/reference/other
      - content_assessment: content quality assessment
        - is_substantive: whether this segment contains substantive knowledge (not pure navigation/TOC/link lists)
        - is_navigation: whether this is navigation/TOC content
        - assessment_reason: one-sentence explanation

      Quality guidelines:
      - Only extract entities that are explicitly named in the text
      - If you cannot determine the entity type, do not force a classification

      Content assessment guidelines:
      - If the segment is just an anchor list, TOC index, or pure links: is_substantive=false, is_navigation=true
      - If the segment contains concrete technical descriptions, parameter explanations, or procedure steps: is_substantive=true
      - Sparse tables with mostly empty or placeholder values are not substantive

      Output example (format reference only, generate based on actual content):
      {"entities": [{"type": "concept", "name": "caching"}], "semantic_role": "concept", "document_type": "feature", "content_assessment": {"is_substantive": true, "is_navigation": false, "assessment_reason": "Contains concrete feature description"}}
    expected_output_type: json_object
    output_schema_json: '{"type":"object","properties":{"entities":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"name":{"type":"string"}},"required":["type","name"],"additionalProperties":false}},"semantic_role":{"type":"string"},"document_type":{"type":"string"},"content_assessment":{"type":"object","properties":{"is_substantive":{"type":"boolean"},"is_navigation":{"type":"boolean"},"assessment_reason":{"type":"string"}},"required":["is_substantive","is_navigation"],"additionalProperties":false}},"required":["entities","semantic_role","document_type","content_assessment"],"additionalProperties":false}'

  - template_key: mining-discourse-relation
    template_version: "2"
    purpose: "Analyze discourse relations between segments (RST)"
    system_prompt: "You are a discourse relation analysis expert for technical documentation."
    user_prompt_template: >
      Analyze discourse relations between the following numbered segments:

      $segments

      For each pair of adjacent or co-section segments, determine their rhetorical relation. Choose the best fit from:
      - ELABORATION: latter elaborates/expands on former (e.g., "specifically", "including", "which consists of")
      - SEQUENCE: segments follow time/step order (e.g., "then", "next", "step N")
      - CAUSATION: one segment is the cause or result of the other (e.g., "therefore", "leads to", "because")
      - EVIDENCE: latter provides evidence or support for former (e.g., "for example", "data shows", "based on")
      - BACKGROUND: former provides background knowledge for latter (e.g., "background", "currently", "status quo")
      - EXEMPLIFICATION: latter is a concrete example of former (e.g., "for instance", "take X as an example")
      - CONTRAST: segments contrast or oppose each other (e.g., "however", "by contrast", "whereas")
      - CONCESSION: acknowledges one view but emphasizes another (e.g., "although", "despite", "even though")
      - CONDITION: former is a triggering condition for latter (e.g., "if", "when", "provided that")
      - PURPOSE: latter states the goal/intent of former (e.g., "in order to", "the purpose is", "so that")

      Output a JSON array, each element with:
      - source: source segment number (integer)
      - target: target segment number (integer)
      - relation: relation type (UPPERCASE, from the 10 types above)
      - confidence: confidence (0.0-1.0)

      Only output segment pairs with clear relations; skip pairs with no clear relation.

      Output example (format reference only, generate based on actual content):
      [{"source": 1, "target": 2, "relation": "ELABORATION", "confidence": 0.9}]
    expected_output_type: json_array
    output_schema_json: '{"type":"array","items":{"type":"object","properties":{"source":{"type":"integer"},"target":{"type":"integer"},"relation":{"type":"string"},"confidence":{"type":"number","minimum":0.0,"maximum":1.0}},"required":["source","target","relation","confidence"],"additionalProperties":false}}'

  - template_key: mining-contextual-retrieval
    template_version: "2"
    purpose: "Generate context description for each segment to enhance retrieval"
    system_prompt: "You are a retrieval context positioning assistant for technical documentation."
    user_prompt_template: >
      Full document:
      $document

      Segment content:
      $segment

      Generate a brief 10-30 word context label describing the segment's position and topic within the document.
      Do not restate the segment content; only provide context not directly visible from the segment text (e.g., section, topic).
      Output a JSON object with a "context" field.

      Output example (format reference only, generate based on actual content):
      {"context": "This segment is in the configuration section discussing parameter defaults"}
    expected_output_type: json_object
    output_schema_json: '{"type":"object","properties":{"context":{"type":"string"}},"required":["context"],"additionalProperties":false}'

eval_questions: []

# ---------------------------------------------------------------------------
# Serving configuration
# ---------------------------------------------------------------------------

serving:
  route_policy:
    default:
      lexical_bm25: {weight: 1.0, top_k: 50}
      entity_exact: {weight: 1.0, top_k: 30}
      dense_vector: {weight: 0.8, top_k: 50}
    command_usage:
      entity_exact: {weight: 1.4, top_k: 20}
      lexical_bm25: {weight: 1.0, top_k: 50}
      dense_vector: {weight: 0.5, top_k: 30}
    concept_lookup:
      dense_vector: {weight: 1.2, top_k: 50}
      lexical_bm25: {weight: 1.0, top_k: 50}
      entity_exact: {weight: 0.6, top_k: 20}
    troubleshooting:
      lexical_bm25: {weight: 1.0, top_k: 50}
      entity_exact: {weight: 1.2, top_k: 30}
      dense_vector: {weight: 0.6, top_k: 30}
    comparison:
      lexical_bm25: {weight: 1.0, top_k: 50}
      dense_vector: {weight: 1.0, top_k: 50}
      entity_exact: {weight: 1.0, top_k: 30}
