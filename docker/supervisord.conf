[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:llm_service]
command=python -m llm_service
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mining]
command=python -m knowledge_mining.mining.api
directory=/app
environment=MINING_API_PORT="8901"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:control]
command=python -m main_control_service.main
directory=/app
environment=MAIN_CONTROL_HOST="0.0.0.0",MAIN_CONTROL_PORT="8910",MAIN_CONTROL_DB_PATH="/app/data/main_control_service/control_plane.db"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:serving]
command=java -jar /app/agent_serving.jar
directory=/app
environment=SCENARIO_PACKS_DIR="/app/scenario_packs",DOMAIN_REGISTRY_PATH="/app/domain_registry.yaml"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp]
command=python -m mcp_server --transport streamable-http --port 9000
directory=/app
environment=SERVING_URL="http://localhost:8081"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
